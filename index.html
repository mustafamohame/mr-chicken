<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستر جكن | صفحة الترحيب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e11b22;
    --red-dark:#b4121a;
    --dark:#0c0c0c;
    --text:#ffffff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;height:100%;
    font-family:'Cairo', system-ui, sans-serif;
    background:var(--dark);
    color:var(--text);
    overflow:hidden;
  }

  /* ---- background video ---- */
  .bg-wrap{
    position:fixed; inset:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 20%, #2a2a2a 0%, #0c0c0c 70%);
  }
  .bg-wrap video,
  .bg-wrap .bg-fallback{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .bg-wrap::after{ /* darken for text legibility */
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to bottom,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.15) 30%,
      rgba(0,0,0,.25) 65%,
      rgba(0,0,0,.75) 100%);
  }

  /* ---- top bar ---- */
  .topbar{
    position:relative; z-index:3;
    display:flex; flex-direction:column; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0 16px;
  }
  .lang-pill{
    align-self:flex-start;
    display:flex; align-items:center; gap:6px;
    background:rgba(225,27,34,.45);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.35);
    padding:7px 14px; border-radius:999px;
    font-weight:600; font-size:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .phones{ display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  .phone-pill{
    display:flex; align-items:center; gap:8px;
    background:rgba(225,27,34,.4);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.3);
    padding:8px 14px; border-radius:12px;
    font-weight:700; font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    text-decoration:none; color:var(--text);
  }
  .phone-pill svg{width:16px;height:16px;flex-shrink:0;}

  /* ---- bottom stack ---- */
  .bottom{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 18px) 18px;
    display:flex; flex-direction:column; gap:12px;
  }
  .btn{
    display:block; width:fit-content; max-width:280px; margin:0 auto;
    text-align:center;
    background:rgba(225,27,34,.38);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    color:var(--text);
    font-weight:700; font-size:13.5px;
    padding:10px 26px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:999px;
    text-decoration:none;
    letter-spacing:.2px;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -8px 16px rgba(0,0,0,.12);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.96); box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2); background:rgba(180,18,26,.5); }
  .btn.secondary{ font-size:12.5px; font-weight:500; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); }
  .btn.main{ font-size:15px; width:fit-content; min-width:180px; background:rgba(225,27,34,.45); }

  .socials{
    display:flex; justify-content:center; gap:12px;
    margin-top:4px;
  }
  .socials a{
    width:40px; height:40px; border-radius:12px;
    background:rgba(225,27,34,.4);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .15s ease;
  }
  .socials a:active{ transform:scale(.92); }
  .socials svg{ width:19px; height:19px; fill:#fff; }

  .brand{
    text-align:center;
    margin-top:6px;
    font-size:11px;
    color:rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .brand b{ color:#ff8a3d; font-weight:800; }

  .page-fade{
    position:fixed; inset:0; z-index:50;
    background:var(--dark);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .page-fade.show{ opacity:1; pointer-events:all; }

  /* responsive cap for large screens */
  .stage{
    max-width:480px; margin:0 auto; height:100%; position:relative;
  }
</style>
</head>
